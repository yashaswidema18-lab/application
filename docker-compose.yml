#kuber
minikube version
kubectl version --client
minikube start
minikube status

mkdir nginx-kubernetes
cd nginx-kubernetes

deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80


kubectl apply -f deployment.yaml
kubectl get deployments
kubectl get pods

service.yaml

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

kubectl apply -f service.yaml
kubectl get services
minikube service nginx-service (access)
minikube service nginx-service --url

kubectl scale deployment nginx-deployment --replicas=5
kubectl get deployments
kubectl get pods

kubectl get pods
kubectl delete pod podname
kubectl get pods

kubectl set image deployment/nginx-deployment nginx=nginx:1.28-alpine
kubectl rollout status deployment/nginx-deployment
kubectl describe deployment nginx-deployment
kubectl rollout undo deployment/nginx-deployment





